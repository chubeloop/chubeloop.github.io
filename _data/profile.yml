bio: >
  **KyoJun Choo** is a student in Computer Science & Engineering at [Soongsil University](https://ssu.ac.kr/)
  and a researcher in the
  [Natural Language Processing Lab](https://nlp.ssu.ac.kr/).
  His research focuses on **Large Language Models (LLMs)**, particularly on understanding
  their internal representations and developing more reliable ways to evaluate their
  capabilities. His primary interests include **LLM evaluation, benchmark reliability and
  validity, and representation-level interpretability**, with additional interests in
  tool-augmented and agentic language models. His long-term goal is to contribute to AI
  systems that people can **understand, evaluate, and use with greater confidence and trust**.
  For more details, please see his [CV](https://chubeloop.github.io/cv.pdf).
